x-deployment:
  database: ${ODOO_AUTO_UPDATE_DB_NAME:-}
  legacy_database: ${LIVE_DB_NAME:-}
  new_database: ${NEW_DB_NAME:-}
  install_modules: ${INSTALL_MODULES:-}
  new_install_modules: ${NEW_INSTALL_MODULES:-}
  backup_passphrase: ${BACKUP_PASSPHRASE:-}
  admin_password: ${NEW_DB_ADMIN_PASSWORD:-}
x-deployer: &deployer
  profiles: [deployment]
  build: ./deploy/runner
  image: elsx-deployment-runner:1.0
  restart: "no"
  init: true
  network_mode: none
  working_dir: ${PWD:-/workspace/odoo-19.0}
  volumes:
    # Same absolute path on the VPS and here: nested Compose bind paths stay correct.
    - type: bind
      source: ..
      target: ${PWD:-/workspace/odoo-19.0}/..
      bind:
        create_host_path: false
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
      bind:
        create_host_path: false
  environment:
    ELSX_DEPLOY_HOST_DIR: ${PWD:-}
    # Forward VPS/CI overrides as well as values resolved from the private .env.
    ODOO_AUTO_UPDATE_DB_NAME: ${ODOO_AUTO_UPDATE_DB_NAME:-}
    LIVE_DB_NAME: ${LIVE_DB_NAME:-}
    NEW_DB_NAME: ${NEW_DB_NAME:-}
    INSTALL_MODULES: ${INSTALL_MODULES:-}
    NEW_INSTALL_MODULES: ${NEW_INSTALL_MODULES:-}
    EXTRA_INSTALL_MODULES: ${EXTRA_INSTALL_MODULES:-}
    BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    NEW_DB_ADMIN_PASSWORD: ${NEW_DB_ADMIN_PASSWORD:-}
    POSTGRES_USER: ${POSTGRES_USER:-odoo}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    ODOO_IMAGE: ${ODOO_IMAGE:-odoo-custom:19.0}
    ODOO_AUTO_ALLOW_INSTALL: ${ODOO_AUTO_ALLOW_INSTALL:-NO}
    ODOO_AUTO_INSTALL_MODULES: ${ODOO_AUTO_INSTALL_MODULES:-}
    ODOO_ADDONS_PATH: ${ODOO_ADDONS_PATH:-/opt/odoo/addons,/opt/odoo/odoo/addons,/opt/odoo/custom_addons,/opt/odoo/custom_addons/elsx_stubs,/opt/odoo/third_party_addons}
    ODOO_EXTRA_ADDONS_PATH: ${ODOO_EXTRA_ADDONS_PATH:-}
    ODOO_MAX_HTTP_THREADS: ${ODOO_MAX_HTTP_THREADS:-24}
    ODOO_ENVIRONMENT: ${ODOO_ENVIRONMENT:-production}
    ODOO_TRUSTED_PROXY_CIDRS: ${ODOO_TRUSTED_PROXY_CIDRS:-}
    ELSX_APPS_PASSWORD_HASH: ${ELSX_APPS_PASSWORD_HASH:-}
    COUNTRY: ${COUNTRY:-IN}
    ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
    ADMIN_LANGUAGE: ${ADMIN_LANGUAGE:-en_US}
    CI: ${CI:-}
services:
  deploy-prod:
    <<: *deployer
    command: [production]

  deploy-new:
    <<: *deployer
    command: [new]

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo}
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-odoo} -d $${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - odoo-network

  odoo:
    build: .
    image: ${ODOO_IMAGE:-odoo-custom:19.0}
    container_name: odoo_app
    restart: unless-stopped
    init: true
    ports:
      - "8069:8069"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-odoo}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-odoo}
      # Preserve DB connections for cron and webhook workers during campaign bursts.
      - ODOO_MAX_HTTP_THREADS=${ODOO_MAX_HTTP_THREADS:-24}
      # Comma-separated addon roots. Add extra mounted third-party roots with
      # ODOO_EXTRA_ADDONS_PATH without editing the committed config file.
      - ODOO_ADDONS_PATH=${ODOO_ADDONS_PATH:-/opt/odoo/addons,/opt/odoo/odoo/addons,/opt/odoo/custom_addons,/opt/odoo/custom_addons/elsx_stubs,/opt/odoo/third_party_addons}
      - ODOO_EXTRA_ADDONS_PATH=${ODOO_EXTRA_ADDONS_PATH:-}
      # Schema updates are performed by deploy-prod.sh during maintenance.
      - ODOO_AUTO_UPDATE_ON_START=NO
      - ELSX_NATIVE_ADMIN_CLEANUP=NO
      - ODOO_ENVIRONMENT=${ODOO_ENVIRONMENT:-production}
      - ODOO_AUTO_BACKUP_ON_UPDATE=${ODOO_AUTO_BACKUP_ON_UPDATE:-YES}
      - ODOO_AUTO_INSTALL_MODULES=${ODOO_AUTO_INSTALL_MODULES:-}
      - ODOO_AUTO_ALLOW_INSTALL=${ODOO_AUTO_ALLOW_INSTALL:-NO}
      - ODOO_AUTO_UPDATE_MODULES=${ODOO_AUTO_UPDATE_MODULES:-all}
      - ODOO_AUTO_UPDATE_DB_NAME=${ODOO_AUTO_UPDATE_DB_NAME:-}
      - LIVE_DB_NAME=${LIVE_DB_NAME:-}
      - DEPLOY_VERIFIED_START=${DEPLOY_VERIFIED_START:-NO}
      - ODOO_TRUSTED_PROXY_CIDRS=${ODOO_TRUSTED_PROXY_CIDRS:-}
      # Optional per-client replacement hash; empty uses the configured Apps gate hash.
      - ELSX_APPS_PASSWORD_HASH=${ELSX_APPS_PASSWORD_HASH:-}
    volumes:
      - ./odoo.docker.conf:/etc/odoo/odoo.conf:ro
      - odoo-web-data:/root/.local/share/Odoo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8069/web/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - odoo-network

  sidecar:
    profiles: [legacy-whatsapp]
    build: ./custom_addons/elsx_whatsapp_marketing/sidecar
    image: elsx-whatsapp-sidecar:1.0
    container_name: whatsapp_sidecar
    restart: unless-stopped
    init: true
    environment:
      - ODOO_URL=http://odoo:8069
      - PORT=3000
      - NODE_ENV=${WHATSAPP_SIDECAR_NODE_ENV:-production}
      - CORS_ORIGIN=${WHATSAPP_SIDECAR_CORS_ORIGIN:-}
      - SIDECAR_SECRET=${SIDECAR_SECRET:-}
      - SOCKET_AUTH_TOKEN=${WHATSAPP_SIDECAR_SOCKET_TOKEN:-}
      - VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      odoo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - odoo-network

  face_sidecar:
    build: ./face_sidecar
    image: elsx-face-sidecar:1.0
    container_name: face_sidecar
    restart: unless-stopped
    init: true
    profiles:
      - face
    environment:
      - PORT=8071
    ports:
      - "8071:8071"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8071/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - odoo-network

  # ── Automated daily backup ──────────────────────────────────────
  # Runs pg_dump daily at 02:00 UTC, keeps the last 7 days.
  # Does NOT use encryption (no BACKUP_PASSPHRASE in container);
  # for encrypted portable bundles use deploy/export_live_encrypted_backup.sh manually.
  db-backup:
    image: postgres:15
    container_name: odoo_db_backup
    restart: unless-stopped
    profiles:
      - backup
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - PGPASSWORD=${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-db-backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "[backup] Automated daily backup service started"
        while true; do
          # Calculate seconds until next 02:00 UTC
          now=$$(date +%s)
          target=$$(date -d "tomorrow 02:00 UTC" +%s 2>/dev/null || date -d "02:00 UTC + 1 day" +%s)
          sleep_secs=$$(( target - now ))
          [ $$sleep_secs -le 0 ] && sleep_secs=86400
          echo "[backup] Next backup in $$sleep_secs seconds (at 02:00 UTC)"
          sleep $$sleep_secs

          echo "[backup] Starting backup at $$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for db in $$(psql -h db -U $${POSTGRES_USER:-odoo} -d postgres -Atc \
            "SELECT datname FROM pg_database WHERE datistemplate = false AND datallowconn = true AND datname NOT IN ('postgres') ORDER BY datname;"); do
            STAMP=$$(date -u +%Y%m%d_%H%M%S)
            DUMP_FILE="/backups/$${db}_$${STAMP}.pg_dump"
            echo "[backup] Dumping $${db} → $${DUMP_FILE}"
            pg_dump -h db -U $${POSTGRES_USER:-odoo} -d "$${db}" --format=custom -f "$${DUMP_FILE}" && \
              echo "[backup] $${db} OK" || \
              echo "[backup] $${db} FAILED"
          done

          # Prune backups older than 7 days
          find /backups -name '*.pg_dump' -mtime +7 -delete
          echo "[backup] Pruned backups older than 7 days. Current backups:"
          ls -lh /backups/*.pg_dump 2>/dev/null || echo "[backup] (none)"
        done
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - odoo-network

networks:
  odoo-network:
    driver: bridge

volumes:
  odoo-db-data:
  odoo-web-data:
  odoo-db-backups:
