version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks:
      - odoo-network

  odoo:
    build: .
    image: odoo-custom:19.0
    container_name: odoo_app
    ports:
      - "8069:8069"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=odoo
      - DB_PASSWORD=odoo
    volumes:
      - .:/opt/odoo
      - ./odoo.docker.conf:/etc/odoo/odoo.conf
      - odoo-web-data:/root/.local/share/Odoo
    depends_on:
      - db
    networks:
      - odoo-network

  sidecar:
    image: node:18-alpine
    container_name: whatsapp_sidecar
    working_dir: /app
    volumes:
      - ./custom_addons/elsx_whatsapp_marketing/sidecar:/app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    networks:
      - odoo-network

networks:
  odoo-network:
    driver: bridge

volumes:
  odoo-db-data:
  odoo-web-data:
