services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo}
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-odoo} -d $${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - odoo-network

  odoo:
    build: .
    image: odoo-custom:19.0
    container_name: odoo_app
    restart: unless-stopped
    init: true
    ports:
      - "8069:8069"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-odoo}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-odoo}
      # Preserve DB connections for cron and webhook workers during campaign bursts.
      - ODOO_MAX_HTTP_THREADS=${ODOO_MAX_HTTP_THREADS:-24}
      # Comma-separated addon roots. Add extra mounted third-party roots with
      # ODOO_EXTRA_ADDONS_PATH without editing the committed config file.
      - ODOO_ADDONS_PATH=${ODOO_ADDONS_PATH:-/opt/odoo/addons,/opt/odoo/odoo/addons,/opt/odoo/custom_addons,/opt/odoo/custom_addons/elsx_stubs,/opt/odoo/third_party_addons}
      - ODOO_EXTRA_ADDONS_PATH=${ODOO_EXTRA_ADDONS_PATH:-}
      # Makes git pull + docker compose up -d --build enough for production.
      # Locked by default: refresh Apps list and upgrade modules already
      # installed in each DB only. No automatic installs or uninstalls.
      - ODOO_AUTO_UPDATE_ON_START=${ODOO_AUTO_UPDATE_ON_START:-YES}
      - ODOO_AUTO_BACKUP_ON_UPDATE=${ODOO_AUTO_BACKUP_ON_UPDATE:-YES}
      - ODOO_AUTO_INSTALL_MODULES=${ODOO_AUTO_INSTALL_MODULES:-}
      - ODOO_AUTO_ALLOW_INSTALL=${ODOO_AUTO_ALLOW_INSTALL:-NO}
      - ODOO_AUTO_UPDATE_MODULES=${ODOO_AUTO_UPDATE_MODULES:-all}
      - ODOO_AUTO_UPDATE_DB_NAME=${ODOO_AUTO_UPDATE_DB_NAME:-}
    volumes:
      - .:/opt/odoo
      - ./odoo.docker.conf:/etc/odoo/odoo.conf
      - odoo-web-data:/root/.local/share/Odoo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8069/web/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - odoo-network

  sidecar:
    build: ./custom_addons/elsx_whatsapp_marketing/sidecar
    image: elsx-whatsapp-sidecar:1.0
    container_name: whatsapp_sidecar
    restart: unless-stopped
    init: true
    environment:
      - ODOO_URL=http://odoo:8069
      - PORT=3000
      - NODE_ENV=${WHATSAPP_SIDECAR_NODE_ENV:-development}
      - CORS_ORIGIN=${WHATSAPP_SIDECAR_CORS_ORIGIN:-}
      - SIDECAR_SECRET=${SIDECAR_SECRET:-}
      - SOCKET_AUTH_TOKEN=${WHATSAPP_SIDECAR_SOCKET_TOKEN:-}
      - VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      odoo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - odoo-network

  face_sidecar:
    build: ./face_sidecar
    image: elsx-face-sidecar:1.0
    container_name: face_sidecar
    restart: unless-stopped
    init: true
    profiles:
      - face
    environment:
      - PORT=8071
    ports:
      - "8071:8071"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8071/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - odoo-network

  # ── Automated daily backup ──────────────────────────────────────
  # Runs pg_dump daily at 02:00 UTC, keeps the last 7 days.
  # Does NOT use encryption (no BACKUP_PASSPHRASE in container);
  # for encrypted portable bundles use deploy/export_live_encrypted_backup.sh manually.
  db-backup:
    image: postgres:15
    container_name: odoo_db_backup
    restart: unless-stopped
    profiles:
      - backup
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - PGPASSWORD=${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-db-backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "[backup] Automated daily backup service started"
        while true; do
          # Calculate seconds until next 02:00 UTC
          now=$$(date +%s)
          target=$$(date -d "tomorrow 02:00 UTC" +%s 2>/dev/null || date -d "02:00 UTC + 1 day" +%s)
          sleep_secs=$$(( target - now ))
          [ $$sleep_secs -le 0 ] && sleep_secs=86400
          echo "[backup] Next backup in $$sleep_secs seconds (at 02:00 UTC)"
          sleep $$sleep_secs

          echo "[backup] Starting backup at $$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for db in $$(psql -h db -U $${POSTGRES_USER:-odoo} -d postgres -Atc \
            "SELECT datname FROM pg_database WHERE datistemplate = false AND datallowconn = true AND datname NOT IN ('postgres') ORDER BY datname;"); do
            STAMP=$$(date -u +%Y%m%d_%H%M%S)
            DUMP_FILE="/backups/$${db}_$${STAMP}.pg_dump"
            echo "[backup] Dumping $${db} → $${DUMP_FILE}"
            pg_dump -h db -U $${POSTGRES_USER:-odoo} -d "$${db}" --format=custom -f "$${DUMP_FILE}" && \
              echo "[backup] $${db} OK" || \
              echo "[backup] $${db} FAILED"
          done

          # Prune backups older than 7 days
          find /backups -name '*.pg_dump' -mtime +7 -delete
          echo "[backup] Pruned backups older than 7 days. Current backups:"
          ls -lh /backups/*.pg_dump 2>/dev/null || echo "[backup] (none)"
        done
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - odoo-network

networks:
  odoo-network:
    driver: bridge

volumes:
  odoo-db-data:
  odoo-web-data:
  odoo-db-backups:
