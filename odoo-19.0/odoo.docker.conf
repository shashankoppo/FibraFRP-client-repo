proxy_mode = True

# Keep the standard database manager available for controlled admin database creation.
# Do not pin dbfilter/db_name here; otherwise new databases created from
# /web/database/manager cannot be selected normally.
# Use the login database selector or URL/session database selection when
# multiple databases exist.
; dbfilter = ^qwerty$
; db_name = qwerty
