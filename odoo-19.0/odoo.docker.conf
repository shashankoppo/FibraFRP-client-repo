# WhatsApp webhooks arrive without an Odoo browser session. Load the WhatsApp
# controller server-wide so Meta verification can reach /whatsapp/webhook
# before a database is selected; the controller still pins the real DB via
# ?db=FiberaFRP_DB and opens that registry explicitly.
