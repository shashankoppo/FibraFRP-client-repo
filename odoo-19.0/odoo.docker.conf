http_port = 8069
max_cron_threads = 1
limit_memory_hard = 3000000000
limit_memory_soft = 2800000000
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
log_level = info
# Connections per Odoo worker × workers + headroom. With 10 databases each
# spawning sessions this needs to be above 64. Set to 128 so that adding
# new databases does not exhaust the PostgreSQL connection pool (PostgreSQL
# max_connections defaults to 100; raise it in postgres image if you add many
# databases simultaneously).
db_maxconn = 64
# MUST stay True for multi-database SaaS setup. Setting False or adding
# dbfilter/db_name would break the database selector and all non-pinned DBs.
list_db = True
# WhatsApp webhooks arrive without an Odoo browser session. Load the WhatsApp
# controller server-wide so Meta verification can reach /whatsapp/webhook
# before a database is selected; the controller still pins the real DB via
# ?db=FiberaFRP_DB and opens that registry explicitly.
server_wide_modules = base,web,elsx_whatsapp_gateway,elsx_public_router
proxy_mode = True

# Keep the standard database manager available for controlled admin database creation.
# Do not pin dbfilter/db_name here; otherwise new databases created from
# /web/database/manager cannot be selected normally.
# Use the login database selector or URL/session database selection when
# multiple databases exist.
; dbfilter = ^qwerty$
; db_name = qwerty
